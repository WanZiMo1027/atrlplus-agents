server:
  port: 8081
spring:
  application:
    name: agent-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: ${NACOS_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  config:
    import: optional:classpath:application-local.yml
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      model-name: deepseek-flash
tencent-memory:
  base-url: http://localhost:8420
  service-id: default
  bearer-token: ${TENCENT_MEMORY_BEARER_TOKEN:local}
  user-key: ${TENCENT_MEMORY_USER_KEY}
  team-id: team-k6gyu6flql
  agent-id: agt-k6o5vyz26h
  user-id: usr-kzdjrfz1k4

admin:
  internal:
    enabled: ${ADMIN_INTERNAL_ENABLED:false}
    token: ${ADMIN_INTERNAL_TOKEN:}

# 上下文预算按保守估算控制；容量满时拒绝接收，不删除尚未可靠归档的原文。
agent:
  # 独立学习开关；开启时才创建专用数据库、模型和后台任务。
  style-learning:
    enabled: ${STYLE_LEARNING_ENABLED:false}
    conversations: ${STYLE_LEARNING_CONVERSATIONS:}
    bot-sender-ids: ${STYLE_LEARNING_BOT_SENDER_IDS:}
    poll-interval: 30s
    message-threshold: 40
    max-new-messages: 80
    overlap-messages: 20
    max-wait: 15m
    input-budget: 32768
    output-tokens: 4096
    model-timeout: 60s
    lease-duration: 2m
    schema: agent_style
    reply:
      enabled: ${STYLE_REPLY_ENABLED:false}
      timeout: 5s
      scene-timeout: 3s
      input-budget: 8192
      sample-budget: 4096
      limit: 3
    database:
      url: ${STYLE_DB_URL:}
      username: ${STYLE_DB_USERNAME:postgres}
      password: ${STYLE_DB_PASSWORD:}
    embedding:
      base-url: ${STYLE_EMBEDDING_BASE_URL:}
      model-name: ${STYLE_EMBEDDING_MODEL_NAME:}
      api-key: ${STYLE_EMBEDDING_API_KEY:}
  context:
    enabled: true
    token-budget: 65536
    compression-threshold: 49152
    keep-recent-messages: 20
    # 摘要按实际输出 Token 校验；缺少有效 usage 时按 UTF-8 字节保守估算，总上下文仍独立核算。
    max-summary-tokens: 2048
    max-long-term-memory-tokens: 4096
    # 主模型 thinking 与决策正文共用；同时作为发送上限与上下文输出预留。
    output-reserved-tokens: 8192
    protocol-reserved-tokens: 512
    # 单图估算上界须按实际多模态服务校准；图片数量和正文均参与最终预算检查。
    image-token-budget: 4096
    compactor-token-budget: 32768
    max-compactions-per-request: 4
    lease-duration: 2m
    model-timeout: 60s
    compactor-timeout: 30s
    # summary-model 可单独设置 api-key、base-url、model-name；缺省继承主模型连接参数。
    storage:
      max-retained-batches: 1000
      max-retained-bytes: 16777216
      max-batch-bytes: 262144
